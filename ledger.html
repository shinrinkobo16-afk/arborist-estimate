<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>見積台帳(パソコン用)</title>
<style>
  :root{
    --main:#2f6b3a;
    --main-dark:#204a28;
    --accent:#c9722a;
    --bg:#f4f5f1;
    --card:#ffffff;
    --border:#d8dbd2;
    --text:#2b2b28;
    --muted:#767a70;
    --danger:#b23b3b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:60px;
  }
  header.appbar{
    background:var(--main);
    color:#fff;
    padding:14px 20px;
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
  }
  header.appbar h1{ font-size:18px; margin:0; }
  main{
    max-width:1100px;
    margin:0 auto;
    padding:16px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
    margin-bottom:16px;
  }
  .card h2{
    font-size:15px;
    margin:0 0 12px 0;
    color:var(--main-dark);
    border-left:4px solid var(--accent);
    padding-left:8px;
  }
  .row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:8px;
    align-items:flex-end;
  }
  .row > div{ flex:1 1 160px; }
  label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:3px;
  }
  input, select{
    width:100%;
    padding:8px;
    border:1px solid var(--border);
    border-radius:6px;
    font-size:14px;
    background:#fff;
  }
  input:focus, select:focus{ outline:2px solid var(--main); }
  button{ cursor:pointer; font-size:13px; }
  .btn{
    background:var(--main);
    color:#fff;
    border:none;
    border-radius:7px;
    padding:9px 14px;
    white-space:nowrap;
  }
  .btn.secondary{ background:#fff; color:var(--main); border:1px solid var(--main); }
  .btn.danger{ background:#fff; color:var(--danger); border:1px solid var(--danger); }
  .btn.small{ padding:5px 9px; font-size:12px; }
  .btn-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
  .note{ font-size:12px; color:var(--muted); margin-top:4px; }
  table.ledger{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  table.ledger th, table.ledger td{
    border:1px solid var(--border);
    padding:7px 8px;
    text-align:left;
    vertical-align:top;
  }
  table.ledger th{
    background:#eef1ea;
    color:var(--main-dark);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  table.ledger th.sorted::after{
    content:" " attr(data-arrow);
  }
  table.ledger td.amount{ text-align:right; white-space:nowrap; }
  table.ledger tbody tr:hover{ background:#fafbf8; }
  .table-wrap{ overflow-x:auto; }
  .summary-bar{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
    font-size:14px;
  }
  .summary-bar .total{ font-weight:bold; color:var(--main-dark); font-size:16px; }
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    display:none;
    align-items:flex-start;
    justify-content:center;
    z-index:50;
    overflow:auto;
    padding:30px 10px;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:#fff;
    border-radius:10px;
    padding:18px;
    max-width:560px;
    width:100%;
  }
  .modal h2{ margin-top:0; color:var(--main-dark); }
  .close-x{
    float:right;
    background:none;
    border:none;
    font-size:20px;
    color:var(--muted);
  }
  .status-msg{
    position:fixed;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    background:var(--main-dark);
    color:#fff;
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    z-index:100;
    opacity:0;
    transition:opacity .3s;
    pointer-events:none;
  }
  .status-msg.show{ opacity:1; }
  @media print{
    header.appbar, .no-print{ display:none !important; }
    body{ background:#fff; padding:0; }
    main{ max-width:none; padding:0; }
  }
</style>
</head>
<body>

<header class="appbar">
  <h1>見積台帳(パソコン用・税務調査対応)</h1>
</header>

<main>

  <div class="card no-print">
    <h2>スマホの見積もりアプリから取り込む</h2>
    <p class="note">見積もりアプリで「台帳用CSVを書き出す」で作られたCSVファイルを選んでください。複数ファイルまとめて選択できます。同じ内容がすでに登録されている場合は重複して追加されません。</p>
    <input type="file" id="csvImportInput" accept=".csv" multiple onchange="importCsvFiles(event)">
  </div>

  <div class="card no-print">
    <h2>検索・絞り込み</h2>
    <div class="row">
      <div>
        <label>キーワード(顧客名・現場住所・見積番号・摘要)</label>
        <input type="text" id="q" oninput="renderTable()" placeholder="例: 山田">
      </div>
      <div>
        <label>日付(から)</label>
        <input type="date" id="fromDate" onchange="renderTable()">
      </div>
      <div>
        <label>日付(まで)</label>
        <input type="date" id="toDate" onchange="renderTable()">
      </div>
      <div style="flex:0 0 auto">
        <button class="btn secondary" onclick="clearFilter()">絞り込み解除</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>台帳一覧</h2>
    <div class="btn-row no-print" style="margin-bottom:10px;">
      <button class="btn" onclick="openAddModal()">＋手入力で追加</button>
      <button class="btn secondary" onclick="exportCsv()">表示中の一覧をCSVで書き出す(Excel用)</button>
      <button class="btn secondary" onclick="window.print()">印刷</button>
      <button class="btn secondary" onclick="backupJson()">バックアップ保存(JSON)</button>
      <button class="btn secondary" onclick="document.getElementById('restoreInput').click()">バックアップから復元</button>
      <input type="file" id="restoreInput" accept=".json" style="display:none" onchange="restoreJson(event)">
    </div>
    <div class="table-wrap">
      <table class="ledger">
        <thead>
          <tr>
            <th data-key="date" onclick="setSort('date')">日付</th>
            <th data-key="customer" onclick="setSort('customer')">顧客名</th>
            <th data-key="address" onclick="setSort('address')">現場住所</th>
            <th data-key="no" onclick="setSort('no')">見積番号</th>
            <th data-key="summary" onclick="setSort('summary')">摘要</th>
            <th data-key="amount" onclick="setSort('amount')">合計金額</th>
            <th class="no-print">操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="summary-bar">
      <div id="countInfo">0件</div>
      <div class="total">合計: <span id="totalAmount">0円</span></div>
    </div>
    <p class="note">このデータはこのパソコン・このブラウザの中に保存されます。税務調査に備えて、月1回程度「バックアップ保存(JSON)」でファイルとして保存しておくことをおすすめします。</p>
  </div>

</main>

<!-- 手入力・編集モーダル -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <button class="close-x" onclick="closeEditModal()">×</button>
    <h2 id="editModalTitle">手入力で追加</h2>
    <div class="row">
      <div>
        <label>日付</label>
        <input type="date" id="e_date">
      </div>
      <div>
        <label>顧客名</label>
        <input type="text" id="e_customer">
      </div>
    </div>
    <div class="row">
      <div>
        <label>現場住所</label>
        <input type="text" id="e_address">
      </div>
      <div>
        <label>見積番号</label>
        <input type="text" id="e_no">
      </div>
    </div>
    <div class="row">
      <div>
        <label>摘要(作業内容)</label>
        <input type="text" id="e_summary">
      </div>
      <div>
        <label>合計金額(円)</label>
        <input type="number" id="e_amount">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn" onclick="saveEditModal()">保存</button>
    </div>
  </div>
</div>

<div class="status-msg" id="statusMsg"></div>

<script>
const STORAGE_KEY = 'estimate_ledger_v1';

function uid(){ return 'r' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function loadRecords(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw) return [];
  try{ return JSON.parse(raw) || []; }catch(e){ return []; }
}
function persistRecords(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

let records = loadRecords();
let sortKey = 'date';
let sortDir = 'desc';
let editingId = null;

function yen(n){
  n = Math.round(n || 0);
  return n.toLocaleString('ja-JP') + '円';
}
function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===== CSV読み込み(スマホアプリからの取り込み) ===== */
function parseCsv(text){
  text = text.replace(/^﻿/, '');
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else{ inQuotes = false; }
      } else {
        field += c;
      }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\r'){ /* skip */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length===1 && r[0] !== ''));
}

function recordKey(r){
  return [r.date, r.customer, r.no, r.amount].join('|');
}

function importCsvFiles(event){
  const files = Array.from(event.target.files || []);
  if(files.length === 0) return;
  const existingKeys = new Set(records.map(recordKey));
  let added = 0, skipped = 0, filesDone = 0;

  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const rows = parseCsv(e.target.result);
      const dataRows = rows.length && /日付/.test(rows[0][0]||'') ? rows.slice(1) : rows;
      dataRows.forEach(cols=>{
        if(!cols[0]) return;
        const rec = {
          id: uid(),
          date: cols[0] || '',
          customer: cols[1] || '',
          address: cols[2] || '',
          no: cols[3] || '',
          summary: cols[4] || '',
          amount: parseFloat((cols[5]||'0').toString().replace(/[^0-9.-]/g,'')) || 0
        };
        const key = recordKey(rec);
        if(existingKeys.has(key)){ skipped++; return; }
        existingKeys.add(key);
        records.push(rec);
        added++;
      });
      filesDone++;
      if(filesDone === files.length){
        persistRecords();
        renderTable();
        showStatus(`${added}件を取り込みました${skipped ? `(${skipped}件は重複のためスキップ)` : ''}`);
      }
    };
    reader.readAsText(file, 'UTF-8');
  });
  event.target.value = '';
}

/* ===== 検索・並び替え・表示 ===== */
function clearFilter(){
  document.getElementById('q').value = '';
  document.getElementById('fromDate').value = '';
  document.getElementById('toDate').value = '';
  renderTable();
}

function setSort(key){
  if(sortKey === key){
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    sortKey = key;
    sortDir = 'asc';
  }
  renderTable();
}

function getFiltered(){
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  const from = document.getElementById('fromDate').value;
  const to = document.getElementById('toDate').value;
  let list = records.filter(r=>{
    if(from && r.date && r.date < from) return false;
    if(to && r.date && r.date > to) return false;
    if(q){
      const hay = [r.customer, r.address, r.no, r.summary].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  list.sort((a,b)=>{
    let av = a[sortKey], bv = b[sortKey];
    if(sortKey === 'amount'){ av = av||0; bv = bv||0; }
    else { av = (av||'').toString(); bv = (bv||'').toString(); }
    if(av < bv) return sortDir === 'asc' ? -1 : 1;
    if(av > bv) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });
  return list;
}

function renderTable(){
  const list = getFiltered();
  const tbody = document.getElementById('tbody');
  if(list.length === 0){
    tbody.innerHTML = `<tr><td colspan="7" class="note" style="padding:14px">データがありません。</td></tr>`;
  } else {
    tbody.innerHTML = list.map(r=>`
      <tr>
        <td>${escapeHtml(r.date)}</td>
        <td>${escapeHtml(r.customer)}</td>
        <td>${escapeHtml(r.address)}</td>
        <td>${escapeHtml(r.no)}</td>
        <td>${escapeHtml(r.summary)}</td>
        <td class="amount">${yen(r.amount)}</td>
        <td class="no-print">
          <button class="btn small secondary" onclick="openEditModal('${r.id}')">編集</button>
          <button class="btn small danger" onclick="deleteRecord('${r.id}')">削除</button>
        </td>
      </tr>
    `).join('');
  }
  document.querySelectorAll('table.ledger th[data-key]').forEach(th=>{
    th.classList.toggle('sorted', th.dataset.key === sortKey);
    th.dataset.arrow = sortDir === 'asc' ? '▲' : '▼';
  });
  const total = list.reduce((s,r)=> s + (parseFloat(r.amount)||0), 0);
  document.getElementById('countInfo').textContent = `${list.length}件`;
  document.getElementById('totalAmount').textContent = yen(total);
}

/* ===== 手入力・編集 ===== */
function openAddModal(){
  editingId = null;
  document.getElementById('editModalTitle').textContent = '手入力で追加';
  document.getElementById('e_date').value = new Date().toISOString().slice(0,10);
  document.getElementById('e_customer').value = '';
  document.getElementById('e_address').value = '';
  document.getElementById('e_no').value = '';
  document.getElementById('e_summary').value = '';
  document.getElementById('e_amount').value = '';
  document.getElementById('editModal').classList.add('open');
}
function openEditModal(id){
  const r = records.find(x=>x.id===id);
  if(!r) return;
  editingId = id;
  document.getElementById('editModalTitle').textContent = '編集';
  document.getElementById('e_date').value = r.date;
  document.getElementById('e_customer').value = r.customer;
  document.getElementById('e_address').value = r.address;
  document.getElementById('e_no').value = r.no;
  document.getElementById('e_summary').value = r.summary;
  document.getElementById('e_amount').value = r.amount;
  document.getElementById('editModal').classList.add('open');
}
function closeEditModal(){
  document.getElementById('editModal').classList.remove('open');
}
function saveEditModal(){
  const data = {
    date: document.getElementById('e_date').value,
    customer: document.getElementById('e_customer').value,
    address: document.getElementById('e_address').value,
    no: document.getElementById('e_no').value,
    summary: document.getElementById('e_summary').value,
    amount: parseFloat(document.getElementById('e_amount').value) || 0
  };
  if(editingId){
    const r = records.find(x=>x.id===editingId);
    Object.assign(r, data);
  } else {
    records.push(Object.assign({id: uid()}, data));
  }
  persistRecords();
  closeEditModal();
  renderTable();
  showStatus('保存しました');
}
function deleteRecord(id){
  if(!confirm('この行を削除します。よろしいですか?')) return;
  records = records.filter(r=>r.id!==id);
  persistRecords();
  renderTable();
}

/* ===== CSV書き出し(Excel用) ===== */
function csvEscape(s){
  s = (s===undefined||s===null) ? '' : String(s);
  if(/[",\n]/.test(s)){ s = '"' + s.replace(/"/g,'""') + '"'; }
  return s;
}
function exportCsv(){
  const list = getFiltered();
  const header = ['日付','顧客名','現場住所','見積番号','摘要','合計金額'];
  const lines = [header.map(csvEscape).join(',')];
  list.forEach(r=>{
    lines.push([r.date, r.customer, r.address, r.no, r.summary, Math.round(r.amount)].map(csvEscape).join(','));
  });
  const csv = lines.join('\r\n') + '\r\n';
  const blob = new Blob(['﻿'+csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '見積台帳_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  showStatus('CSVを書き出しました');
}

/* ===== バックアップ・復元 ===== */
function backupJson(){
  const blob = new Blob([JSON.stringify(records, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '見積台帳バックアップ_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showStatus('バックアップを保存しました');
}
function restoreJson(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error('invalid');
      if(!confirm(`${data.length}件のバックアップを読み込みます。現在のデータに追加されます(重複はスキップ)。よろしいですか?`)) return;
      const existingKeys = new Set(records.map(recordKey));
      let added = 0;
      data.forEach(r=>{
        const rec = {
          id: r.id || uid(),
          date: r.date || '', customer: r.customer || '', address: r.address || '',
          no: r.no || '', summary: r.summary || '', amount: parseFloat(r.amount)||0
        };
        const key = recordKey(rec);
        if(existingKeys.has(key)) return;
        existingKeys.add(key);
        records.push(rec);
        added++;
      });
      persistRecords();
      renderTable();
      showStatus(`${added}件を復元しました`);
    }catch(err){
      alert('ファイルの読み込みに失敗しました');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function showStatus(msg){
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2200);
}

renderTable();
</script>
</body>
</html>
